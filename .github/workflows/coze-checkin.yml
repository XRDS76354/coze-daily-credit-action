name: Coze daily check-in

on:
  schedule:
    # 00:05 Asia/Shanghai (UTC+8)
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coze-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Coze daily check-in
        env:
          COZE_COOKIES_JSON_1: ${{ secrets.COZE_COOKIES_JSON_1 }}
          COZE_COOKIES_JSON_2: ${{ secrets.COZE_COOKIES_JSON_2 }}
          COZE_ACCOUNT_NAMES: ${{ vars.COZE_ACCOUNT_NAMES }}
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          PLAYWRIGHT_TIMEOUT_MS: "30000"
          POST_LOAD_WAIT_MS: "5000"
        run: npm start

      - name: Write run summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (!summaryPath || !fs.existsSync("artifacts/result.json")) process.exit(0);
          const result = JSON.parse(fs.readFileSync("artifacts/result.json", "utf8"));
          const lines = [`## Coze 签到结果 ${result.date || ""}`, ""];
          if (Array.isArray(result.accounts) && result.accounts.length) {
            lines.push("| 账号 | 结果 | 说明 |", "| --- | --- | --- |");
            for (const account of result.accounts) {
              const message = String(account.message || "").replace(/\|/g, "\\|");
              lines.push(`| ${account.name} | ${account.success ? "成功" : "失败"} | ${message} |`);
            }
          }
          if (result.error) lines.push("", `错误：${result.error}`);
          fs.appendFileSync(summaryPath, lines.join("\n") + "\n");
          NODE

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: coze-failure
          path: artifacts/
          if-no-files-found: ignore

      - name: Update Coze cookie secrets
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COZE_REFRESH_TARGETS: >-
            [{"secret":"COZE_COOKIES_JSON_1","path":"artifacts/storage_state.account1.updated.json"},{"secret":"COZE_COOKIES_JSON_2","path":"artifacts/storage_state.account2.updated.json"}]
        run: npm run update-secret
